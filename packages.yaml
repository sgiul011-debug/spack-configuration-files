packages:
  all:
    variants:
    - +mpi
    prefer:
    - "%nvhpc@25.11"
  openssl:
    require:
    -"@3.2.2"
    - build_system=generic 
    - certs=mozilla 
    - ~docs 
    - +shared' 
  libxc:
    variants:
    - ~cuda
  quantum-espresso: 
    require: 
    - "@7.5" 
    - +mpigpu
    - +natx
    - ~scalapack 
    - +libxc 
    - ~phonon 
    - build_type=RelWithDebInfo
  vasp:
    require: 
    - "@6.4.3"
    variants:
    - ~libxc
    - +wannier90
    - +openmp 
    - +hdf5 
    - +fftlib
  wannier90:
    require: 
    - "@3.1.0"
    - +wannier2vasp
  scorep:
    variants:
    - +papi
  yambo:
    require: 
    - "5.3.0" 
    - +openmp
    - +memory
    - +time
    - +parallel_io
    - +scalapack
    - +slepc
    - +nl
    - +ph
    - +rt
    - +sc
  devicexlib:
    version: [0.9.0]
  hpcx-mpi:
    version: [2.25.1]
    externals:
    - spec: hpcx-mpi@2.25.1
      prefix: /cineca/prod/spack/07/install/linux-zen4/nvhpc-25.11-kv23bdcddbvo3txmggqecr7mfhz2tqq7/Linux_x86_64/25.11/comm_libs/13.0/
hpcx/hpcx-2.25.1/ompi
    buildable: false
  slepc:
    variants:
    - -arpack
  boost:
    variants:
    - cxxstd=14
  hdf5:
    variants:
    - +hl 
  netcdf-c:
    variants:
    - +parallel-netcdf
  petsc:
    variants:
    - +mumps 
    - -fftw   
    - -double 
    - ~fortran-bindings 
    require:
    - -cuda  


