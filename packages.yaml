packages:
  all:
    variants:
    - cuda_arch=90
    - +cuda
  cuda:
    require:
    - "@12.6.0"
    variants:
    - +compat
    - +cupti
    - +samples~full 
    - samples_arch=90
  gcc: 
    variants:
    - -bootstrap +nvptx
    version: [13.4.0]    
  llvm:
    require:
    - -cuda
  yambo:
    variants:
    - +cuda-fortran 
  gromacs:
    require:
    - "@2025.0"
  lammps:
    require:
    - +cuda
    - +cuda_mps
    - +kokkos
    - fft_kokkos=cufft
    - cuda_arch=90 
  kokkos:
    require:
    - +wrapper
    - +cuda_constexpr
  libxc:
    require:
    - -cuda
  namd:
    require:
    - +cuda
    - cuda_arch=90
  vasp: 
    require:
    - +cuda
    - cuda_arch=90
 
