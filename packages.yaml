packages:
  all:
    variants:
    - +mpi
    #compiler:
    #- gcc@15.2.0 ~bootstrap+nvptx
  boost:
    variants:
    - +container 
    - +mpi    
  hdf5:
    variants:
    - +hl
  netcdf-c:
    variants:
    - +mpi 
    - +parallel-netcdf
  osu-micro-benchmarks:
    variants:
    - ~xccl
  petsc:
    variants:
    - +mpi 
    - +mumps 
    - +scalapack 
    - +fftw 
  gsl: 
    variants:
    - +external-cblas  
  plumed:
