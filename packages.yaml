packages:
  all:
    variants:
    - cuda_arch=90
    - +cuda
  cuda:
    require:
    - "@13.0.2"
    variants:
    - +compat
    - +cupti
    - +samples~full 
    - samples_arch=90
  gcc: 
    variants:
    - -bootstrap +nvptx
    version: [15.2.0]
  llvm:
    require:
    - -cuda
  yambo:
    variants:
    - +cuda-fortran 
  gromacs:
    require:
    - "2026.1"
  lammps:
    variants:
       +cuda_mps
       +kokkos
       - fft_kokkos=cufft 
    
    
