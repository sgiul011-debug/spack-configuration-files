    - "@2026.1"
    variants:
    - +mpi
    - +plumed
    - +openmp 
    - smm=blas 
    - lmax=6
  openmpi:
    require:
    - "@4.1.6"
    variants:
    - +legacylaunchers
    - ~wrapper-rpath
    - ~static
    - fabrics=ucx,ucc,cma 
    #- ~gpfs 
    #- +lustre
    - ~internal-pmix 
    - ~internal-hwloc 
  openblas:
    variants:
    - -ilp64 
    - threads=openmp
  fftw:
    variants:
    - +mpi 
    - ~openmp  
  elpa:
    require:
    - "@2024.03.001"
    variants:
    - -openmp
  parallelio:
    variants:
    - +pnetcdf  
  esmf:
    variants:
    - +external-lapack 
    - +pnetcdf  
  lammps:
    variants:
    - +diffraction
    - +meam
    - +ml-snap 
    - +ml-pace 
    - +reaction 
    - +reaxff 
    - +voronoi 
    - +yaff 
    - ~intel 
    - ~kim 
    - +asphere 
    - +class2
    - +kspace 
    - +manybody 
    - +molecule 
    - +extra-dump 
    - +opt 
    - +replica
    - +rigid
    - +granular 
    - +openmp-package 
    - +openmp  
  ucc:
    externals:
    - spec: ucc@1.6.0
      prefix: $(spack location -i nvhpc ^gcc@15.2.0)/Linux_x86_64/25.11/comm_libs/latest/hpcx/hpcx-2.25.1/ucc
    buildable: false
  ucx:
    externals:
    - spec: ucx@1.20.0 +cuda +thread_multiple
      prefix: $(spack location -i nvhpc ^gcc@15.2.0)/Linux_x86_64/25.11/comm_libs/latest/hpcx/hpcx-2.25.1/ucx
    buildable: false
  
