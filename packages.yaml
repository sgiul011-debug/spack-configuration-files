packages:
  all:
    variants:
    - cuda_arch=90
    - +cuda
  cuda:
    require:
    - "@13.0.2"
    variants:
    - +compat
    - +cupti
    - +samples~full 
    - samples_arch=90
  gcc: 
    variants:
    - -bootstrap +nvptx
    require:
    - "@15.2.0"
  llvm:
    require:
    - -cuda
  yambo:
    variants:
    - +cuda-fortran 
  gromacs:
    require:
    - "@2026.1"
  lammps:
    require:
    - +cuda
    - +cuda_mps
    - +kokkos
    - fft_kokkos=cufft
    - cuda_arch=90
  kokkos:
    require:
    - +wrapper
    - +cuda_constexpr 
  libxc:
    require:
    - -cuda 
  namd:
    require:
    - +cuda 
    - cuda_arch=90
  vasp:
    require:
    - +cuda
    - cuda_arch=90

